[project]
name = "trlavanda"
version = "0.1.0"
description = "Screener y backtest de inversión por factores (valor, calidad, momentum, crecimiento). Proyecto de aprendizaje."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=2.0,<3",       # sin límite, la 2.0 entró sola en el lockfile y rompió el primer arranque
    "pyarrow>=18",          # puente Polars <-> pandas (yfinance devuelve pandas)
    "pandas>=2.2",          # solo donde una librería lo exige (yfinance, read_html)
    "lxml>=5",              # parser HTML para leer las tablas de Wikipedia
    "yfinance>=0.2.50",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "statsmodels>=0.14",
    "tqdm>=4.66",
    "fastapi>=0.115",
    "confluent-kafka>=2.16",
    "jsonschema>=4.23",
]

[project.scripts]
trl-datos = "trlavanda.pipelines.download_data:main"
trl-ranking = "trlavanda.pipelines.ranking:main"
trl-web = "trlavanda.pipelines.web:main"
trl-update = "trlavanda.pipelines.update:main"
trl-bus = "trlavanda.bus:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel>=6",
    "matplotlib>=3.9",
    "gitpython>=3.2.0",
    "ghp-import>=2.1.0",
    "httpx>=0.27",
    # servicios del workspace: así `uv sync` los instala para los tests
    "trlavanda-ingest",
    "trlavanda-factors",
]

[tool.uv.workspace]
members = ["services/ingest", "services/factors"]  # solo los servicios Python

[tool.uv.sources]
trlavanda-ingest = { workspace = true }
trlavanda-factors = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trlavanda"]

[tool.pytest.ini_options]
testpaths = ["tests", "services"]
pythonpath = ["src"]
markers = ["kafka: necesita Kafka arrancado (docker compose up -d); se salta si no está"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
