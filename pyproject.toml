[project]
name = "trlavanda"
version = "0.1.0"
description = "Screener y backtest de inversión por factores (valor, calidad, momentum, crecimiento). Proyecto de aprendizaje."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.20",
    "pyarrow>=18",          # puente Polars <-> pandas (yfinance devuelve pandas)
    "pandas>=2.2",          # solo donde una librería lo exige (yfinance, read_html)
    "lxml>=5",              # parser HTML para leer las tablas de Wikipedia
    "yfinance>=0.2.50",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "statsmodels>=0.14",
    "tqdm>=4.66",
]

[project.scripts]
trl-datos = "trlavanda.pipelines.download_data:main"
trl-ranking = "trlavanda.pipelines.ranking:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel>=6",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trlavanda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
