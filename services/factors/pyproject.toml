[project]
name = "trlavanda-factors"
version = "0.1.0"
description = "Servicio factors: fundamentales point-in-time y scores a partir de las versiones de ingest."
requires-python = ">=3.12"
dependencies = [
    "trlavanda",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.scripts]
trl-factors = "trlavanda_factors.main:main"

[tool.uv.sources]
trlavanda = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trlavanda_factors"]
