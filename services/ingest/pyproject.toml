[project]
name = "trlavanda-ingest"
version = "0.1.0"
description = "Servicio ingest: descarga, versiona y anuncia los datos (universo, EDGAR, precios)."
requires-python = ">=3.12"
dependencies = [
    "trlavanda",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
trl-ingest = "trlavanda_ingest.main:main"

[tool.uv.sources]
trlavanda = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trlavanda_ingest"]
